services:
  mysql:
    image: mysql:8.0
    container_name: dormitory_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=access-secret-key
      - AUTH_SERVICE_URL=http://auth-service:3001
      - STUDENT_SERVICE_URL=http://student-service:3002
      - ROOM_SERVICE_URL=http://room-service:3003
      - REGISTRATION_SERVICE_URL=http://registration-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - COMPLAINT_SERVICE_URL=http://complaint-service:3006
      - UTILITY_SERVICE_URL=http://utility-service:3007
    depends_on:
      auth-service:
        condition: service_started
      student-service:
        condition: service_started
      room-service:
        condition: service_started
      registration-service:
        condition: service_started
      payment-service:
        condition: service_started
      complaint-service:
        condition: service_started
      utility-service:
        condition: service_started

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/auth_db
      - PORT=3001
      - JWT_SECRET=access-secret-key
      - REFRESH_SECRET=refresh-secret-key
    depends_on:
      mysql:
        condition: service_healthy

  student-service:
    build: ./student-service
    container_name: student-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/student_db
      - PORT=3002
    depends_on:
      mysql:
        condition: service_healthy

  room-service:
    build: ./room-service
    container_name: room-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/room_db
      - PORT=3003
    depends_on:
      mysql:
        condition: service_healthy

  registration-service:
    build: ./registration-service
    container_name: registration-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/registration_db
      - PORT=3004
    depends_on:
      mysql:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/payment_db
      - PORT=3005
    depends_on:
      mysql:
        condition: service_healthy

  complaint-service:
    build: ./complaint-service
    container_name: complaint-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/complaint_db
      - PORT=3006
    depends_on:
      mysql:
        condition: service_healthy

  utility-service:
    build: ./utility-service
    container_name: utility-service
    restart: always
    command: sh -c "sleep 10 && npx prisma db push --accept-data-loss && npm start"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/utility_db
      - PORT=3007
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: